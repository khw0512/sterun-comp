<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#d0d0d0"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#666"/>
    </marker>
    <marker id="arrow-left" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="#F0F2F5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">3단 접지 양면 리플렛 템플릿</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#666">Tri-fold Double-Sided Leaflet</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- FRONT / OUTSIDE (앞면) -->
  <!-- ═══════════════════════════════════════════ -->
  <text x="64" y="92" font-size="13" font-weight="700" fill="#333">앞면 (Outside)</text>
  <line x1="64" y1="96" x2="896" y2="96" stroke="#ccc" stroke-width="1"/>

  <!-- Panel dimensions guide -->
  <!-- Total width: 832px (64 to 896), each panel ~277px -->

  <!-- PANEL A3 — 앞표지 (Front Cover) — CENTER of outside -->
  <rect x="341" y="108" width="278" height="210" fill="#ffffff" filter="url(#shadow)" rx="2"/>
  <!-- header bar -->
  <rect x="341" y="108" width="278" height="36" fill="#2E86AB" rx="2"/>
  <text x="480" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">앞표지 (Front Cover)</text>
  <!-- logo placeholder -->
  <rect x="400" y="155" width="160" height="50" fill="#e8f4f8" rx="4" stroke="#2E86AB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="480" y="176" text-anchor="middle" font-size="10" fill="#2E86AB" font-weight="600">LOGO</text>
  <text x="480" y="192" text-anchor="middle" font-size="9" fill="#999">로고 / 브랜드명</text>
  <!-- title text placeholder -->
  <rect x="361" y="216" width="238" height="18" fill="#f5f5f5" rx="3"/>
  <text x="480" y="228" text-anchor="middle" font-size="9" fill="#888">제목 텍스트 (Title)</text>
  <rect x="381" y="242" width="198" height="12" fill="#f5f5f5" rx="3"/>
  <text x="480" y="252" text-anchor="middle" font-size="8" fill="#bbb">부제목 (Subtitle)</text>
  <!-- decorative lines -->
  <line x1="361" y1="263" x2="599" y2="263" stroke="#2E86AB" stroke-width="2"/>
  <!-- contact/date -->
  <rect x="361" y="270" width="108" height="10" fill="#f0f0f0" rx="2"/>
  <rect x="479" y="270" width="120" height="10" fill="#f0f0f0" rx="2"/>
  <text x="415" y="279" text-anchor="middle" font-size="7" fill="#aaa">연락처</text>
  <text x="539" y="279" text-anchor="middle" font-size="7" fill="#aaa">날짜 / 기간</text>
  <!-- image area -->
  <rect x="361" y="287" width="238" height="25" fill="#e8e8e8" rx="3"/>
  <text x="480" y="303" text-anchor="middle" font-size="8" fill="#999">이미지 / 배경</text>
  <!-- panel label -->
  <text x="480" y="330" text-anchor="middle" font-size="9" fill="#aaa">패널 3 · 앞표지</text>

  <!-- PANEL A2 — 안쪽 덮개 (Inside Flap / Back) — RIGHT of outside -->
  <rect x="619" y="108" width="277" height="210" fill="#ffffff" filter="url(#shadow)" rx="2"/>
  <rect x="619" y="108" width="277" height="28" fill="#48CAE4" rx="2"/>
  <text x="758" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">안쪽 덮개 (Inside Flap)</text>
  <!-- small image box -->
  <rect x="639" y="145" width="237" height="55" fill="#f0fbff" rx="4" stroke="#48CAE4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="758" y="169" text-anchor="middle" font-size="9" fill="#48CAE4">이미지 영역</text>
  <text x="758" y="184" text-anchor="middle" font-size="8" fill="#bbb">Image Area</text>
  <!-- text lines -->
  <rect x="639" y="210" width="237" height="10" fill="#f5f5f5" rx="2"/>
  <rect x="639" y="225" width="200" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="639" y="238" width="220" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="639" y="251" width="180" height="8" fill="#f5f5f5" rx="2"/>
  <text x="758" y="220" text-anchor="middle" font-size="7" fill="#ccc">본문 텍스트 영역</text>
  <!-- contact block -->
  <rect x="639" y="270" width="110" height="30" fill="#e8f9fc" rx="3" stroke="#48CAE4" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="694" y="283" text-anchor="middle" font-size="8" fill="#48CAE4" font-weight="600">연락처 정보</text>
  <text x="694" y="294" text-anchor="middle" font-size="7" fill="#aaa">전화 / 이메일</text>
  <rect x="759" y="270" width="117" height="30" fill="#e8f9fc" rx="3" stroke="#48CAE4" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="818" y="283" text-anchor="middle" font-size="8" fill="#48CAE4" font-weight="600">SNS / 웹사이트</text>
  <text x="818" y="294" text-anchor="middle" font-size="7" fill="#aaa">URL / QR코드</text>
  <text x="758" y="330" text-anchor="middle" font-size="9" fill="#aaa">패널 2 · 안쪽 덮개</text>

  <!-- PANEL A1 — 뒤표지 (Back Cover) — LEFT of outside -->
  <rect x="64" y="108" width="277" height="210" fill="#ffffff" filter="url(#shadow)" rx="2"/>
  <rect x="64" y="108" width="277" height="28" fill="#6B4FBB" rx="2"/>
  <text x="203" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">뒤표지 (Back Cover)</text>
  <!-- address/info block -->
  <rect x="84" y="145" width="237" height="40" fill="#f5f2ff" rx="4" stroke="#6B4FBB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="203" y="160" text-anchor="middle" font-size="8" fill="#6B4FBB" font-weight="600">주소 / 발행처 정보</text>
  <text x="203" y="173" text-anchor="middle" font-size="7" fill="#aaa">Address / Publisher</text>
  <!-- QR code placeholder -->
  <rect x="84" y="195" width="50" height="50" fill="#ede9ff" rx="3" stroke="#6B4FBB" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="109" y="216" text-anchor="middle" font-size="7" fill="#6B4FBB" font-weight="600">QR</text>
  <text x="109" y="228" text-anchor="middle" font-size="6" fill="#aaa">코드</text>
  <!-- text lines -->
  <rect x="144" y="198" width="177" height="9" fill="#f5f5f5" rx="2"/>
  <rect x="144" y="212" width="140" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="144" y="225" width="160" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="144" y="238" width="120" height="8" fill="#f5f5f5" rx="2"/>
  <!-- copyright line -->
  <line x1="84" y1="264" x2="301" y2="264" stroke="#ddd" stroke-width="1"/>
  <rect x="84" y="270" width="237" height="10" fill="#f0f0f0" rx="2"/>
  <text x="203" y="279" text-anchor="middle" font-size="7" fill="#bbb">© 저작권 / 발행일 / 면책조항</text>
  <text x="203" y="330" text-anchor="middle" font-size="9" fill="#aaa">패널 1 · 뒤표지</text>

  <!-- Fold lines on front -->
  <line x1="341" y1="104" x2="341" y2="322" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="619" y1="104" x2="619" y2="322" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Fold arrows + labels -->
  <text x="341" y="342" text-anchor="middle" font-size="9" fill="#E74C3C" font-weight="600">← 접지선 (Fold)</text>
  <text x="619" y="342" text-anchor="middle" font-size="9" fill="#E74C3C" font-weight="600">접지선 (Fold) →</text>

  <!-- Dimension annotations -->
  <line x1="64" y1="356" x2="341" y2="356" stroke="#999" stroke-width="1" marker-start="url(#arrow-left)" marker-end="url(#arrow)"/>
  <text x="203" y="370" text-anchor="middle" font-size="9" fill="#888">1/3 폭 (≈99mm)</text>
  <line x1="341" y1="356" x2="619" y2="356" stroke="#999" stroke-width="1" marker-start="url(#arrow-left)" marker-end="url(#arrow)"/>
  <text x="480" y="370" text-anchor="middle" font-size="9" fill="#888">1/3 폭 (≈99mm)</text>
  <line x1="619" y1="356" x2="896" y2="356" stroke="#999" stroke-width="1" marker-start="url(#arrow-left)" marker-end="url(#arrow)"/>
  <text x="758" y="370" text-anchor="middle" font-size="9" fill="#888">1/3 폭 (≈99mm)</text>

  <!-- Height annotation -->
  <line x1="916" y1="108" x2="916" y2="318" stroke="#999" stroke-width="1" marker-start="url(#arrow-left)" marker-end="url(#arrow)"/>
  <text x="940" y="218" text-anchor="middle" font-size="9" fill="#888" transform="rotate(90,940,218)">높이 (≈210mm)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BACK / INSIDE (뒷면) -->
  <!-- ═══════════════════════════════════════════ -->
  <text x="64" y="400" font-size="13" font-weight="700" fill="#333">뒷면 (Inside)</text>
  <line x1="64" y1="404" x2="896" y2="404" stroke="#ccc" stroke-width="1"/>

  <!-- PANEL B1 — 안쪽 왼쪽 (Inside Left) -->
  <rect x="64" y="416" width="277" height="210" fill="#ffffff" filter="url(#shadow)" rx="2"/>
  <rect x="64" y="416" width="277" height="28" fill="#27AE60" rx="2"/>
  <text x="203" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">안쪽 왼쪽 (Inside Left)</text>
  <!-- image box -->
  <rect x="84" y="453" width="237" height="60" fill="#f0fdf4" rx="4" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="203" y="479" text-anchor="middle" font-size="9" fill="#27AE60">이미지 / 그래픽</text>
  <text x="203" y="493" text-anchor="middle" font-size="8" fill="#bbb">Image / Graphic</text>
  <!-- section heading -->
  <rect x="84" y="523" width="130" height="12" fill="#e8f8f0" rx="2"/>
  <text x="149" y="533" text-anchor="middle" font-size="8" fill="#27AE60" font-weight="600">소제목 (Subheading)</text>
  <!-- text lines -->
  <rect x="84" y="542" width="237" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="84" y="555" width="220" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="84" y="568" width="200" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="84" y="581" width="237" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="84" y="594" width="180" height="8" fill="#f5f5f5" rx="2"/>
  <text x="203" y="538" text-anchor="middle" font-size="7" fill="#ccc">본문 내용 텍스트</text>
  <text x="203" y="630" text-anchor="middle" font-size="9" fill="#aaa">패널 4 · 안쪽 왼쪽</text>

  <!-- PANEL B2 — 안쪽 가운데 (Inside Center) -->
  <rect x="341" y="416" width="278" height="210" fill="#ffffff" filter="url(#shadow)" rx="2"/>
  <rect x="341" y="416" width="278" height="28" fill="#E67E22" rx="2"/>
  <text x="480" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">안쪽 가운데 (Inside Center)</text>
  <!-- big image placeholder -->
  <rect x="361" y="453" width="238" height="75" fill="#fff8f0" rx="4" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="480" y="490" text-anchor="middle" font-size="9" fill="#E67E22">메인 이미지 영역</text>
  <text x="480" y="505" text-anchor="middle" font-size="8" fill="#bbb">Main Image Area</text>
  <!-- features/bullet list -->
  <text x="376" y="545" font-size="8" fill="#E67E22" font-weight="700">▶</text>
  <rect x="390" y="538" width="196" height="9" fill="#f5f5f5" rx="2"/>
  <text x="488" y="546" text-anchor="middle" font-size="7" fill="#ccc">핵심 내용 1</text>
  <text x="376" y="562" font-size="8" fill="#E67E22" font-weight="700">▶</text>
  <rect x="390" y="555" width="196" height="9" fill="#f5f5f5" rx="2"/>
  <text x="488" y="563" text-anchor="middle" font-size="7" fill="#ccc">핵심 내용 2</text>
  <text x="376" y="579" font-size="8" fill="#E67E22" font-weight="700">▶</text>
  <rect x="390" y="572" width="196" height="9" fill="#f5f5f5" rx="2"/>
  <text x="488" y="580" text-anchor="middle" font-size="7" fill="#ccc">핵심 내용 3</text>
  <text x="376" y="596" font-size="8" fill="#E67E22" font-weight="700">▶</text>
  <rect x="390" y="589" width="196" height="9" fill="#f5f5f5" rx="2"/>
  <text x="488" y="597" text-anchor="middle" font-size="7" fill="#ccc">핵심 내용 4</text>
  <text x="480" y="630" text-anchor="middle" font-size="9" fill="#aaa">패널 5 · 안쪽 가운데</text>

  <!-- PANEL B3 — 안쪽 오른쪽 (Inside Right) -->
  <rect x="619" y="416" width="277" height="210" fill="#ffffff" filter="url(#shadow)" rx="2"/>
  <rect x="619" y="416" width="277" height="28" fill="#C0392B" rx="2"/>
  <text x="758" y="435" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">안쪽 오른쪽 (Inside Right)</text>
  <!-- icon grid -->
  <rect x="639" y="453" width="70" height="55" fill="#fdf2f0" rx="4" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="674" y="477" text-anchor="middle" font-size="8" fill="#C0392B">아이콘</text>
  <text x="674" y="491" text-anchor="middle" font-size="7" fill="#bbb">01</text>
  <rect x="719" y="453" width="70" height="55" fill="#fdf2f0" rx="4" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="754" y="477" text-anchor="middle" font-size="8" fill="#C0392B">아이콘</text>
  <text x="754" y="491" text-anchor="middle" font-size="7" fill="#bbb">02</text>
  <rect x="799" y="453" width="77" height="55" fill="#fdf2f0" rx="4" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="838" y="477" text-anchor="middle" font-size="8" fill="#C0392B">아이콘</text>
  <text x="838" y="491" text-anchor="middle" font-size="7" fill="#bbb">03</text>
  <!-- section heading -->
  <rect x="639" y="518" width="130" height="12" fill="#fde8e6" rx="2"/>
  <text x="704" y="528" text-anchor="middle" font-size="8" fill="#C0392B" font-weight="600">소제목 (Subheading)</text>
  <!-- text lines -->
  <rect x="639" y="537" width="237" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="639" y="550" width="210" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="639" y="563" width="237" height="8" fill="#f5f5f5" rx="2"/>
  <rect x="639" y="576" width="190" height="8" fill="#f5f5f5" rx="2"/>
  <!-- CTA button -->
  <rect x="689" y="592" width="138" height="24" fill="#C0392B" rx="12"/>
  <text x="758" y="608" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">CTA 버튼</text>
  <text x="758" y="630" text-anchor="middle" font-size="9" fill="#aaa">패널 6 · 안쪽 오른쪽</text>

  <!-- Fold lines on back -->
  <line x1="341" y1="412" x2="341" y2="630" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="619" y1="412" x2="619" y2="630" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Legend at bottom -->
  <rect x="64" y="648" width="832" height="58" fill="#fff" rx="6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="84" y="665" font-size="11" font-weight="700" fill="#333">범례 (Legend)</text>
  <!-- Fold line -->
  <line x1="84" y1="680" x2="120" y2="680" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="128" y="684" font-size="10" fill="#555">접지선 (Fold Line)</text>
  <!-- Image area -->
  <rect x="230" y="671" width="28" height="18" fill="#e8f4f8" rx="2" stroke="#2E86AB" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="265" y="684" font-size="10" fill="#555">이미지 영역</text>
  <!-- Text area -->
  <rect x="360" y="671" width="28" height="18" fill="#f5f5f5" rx="2"/>
  <text x="395" y="684" font-size="10" fill="#555">텍스트 영역</text>
  <!-- Panel numbering -->
  <text x="480" y="684" font-size="10" fill="#555">|  접지 순서: 패널3(앞표지) → 패널2 접기 → 패널1 접기</text>
  <!-- Size note -->
  <text x="84" y="698" font-size="9" fill="#999">권장 규격: A4 (297×210mm) 또는 Letter (11×8.5in)  |  출력 도련: 3mm  |  안전 영역: 5mm</text>

</svg>
